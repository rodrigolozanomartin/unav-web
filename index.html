  .ann-row .state{margin-right:7px}
  .ann-row .mega{margin-right:9px}
  .ann-text{flex:1;min-width:0;padding-right:40px}
  .ann-title{font-weight:700}
  .ann-prev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Anuncio abierto (panel lateral como en Blackboard Ultra) */
  .peek{
    position:fixed;top:0;bottom:0;right:0;left:36px;z-index:60;background:#fff;display:flex;flex-direction:column;
    transform:translateX(100%);visibility:hidden;transition:transform .45s cubic-bezier(.25,.8,.25,1),visibility .45s;
  }
  .peek.show{transform:none;visibility:visible}
  .peek-close{
    position:absolute;left:-24px;top:30px;width:40px;height:40px;background:#ff0000;color:#000;
    display:flex;align-items:center;justify-content:center;z-index:1;
  }
  .peek-close::after{
    content:"";position:absolute;left:0;top:40px;width:0;height:0;
    border-top:15px solid #bf0000;border-left:24px solid transparent;
  }
  .peek-close:focus{outline:none}
  .peek-close:focus-visible{outline:2px solid #000;outline-offset:2px}
  .peek-head{padding:22px 30px 22px 30px;border-bottom:1px solid #cdcdcd;flex-shrink:0}
  .peek-kicker{font-size:14px;line-height:1.6}
  .peek-head h1{font-family:"Noto Serif",Georgia,serif;font-weight:400;font-size:32px;line-height:1.25;color:var(--text)}
  .peek-body{padding:10px 31px 60px;overflow-y:auto;flex:1;font-size:14px;line-height:21px}
  .peek-body p{margin:0}

  /* Anuncio abierto (antiguo) */
  .ann{max-width:900px;border:1px solid var(--border);border-radius:4px;padding:24px 28px}
  .ann-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .ann-head .who{font-weight:600;font-size:14px}
  .ann-head .when{font-size:12px;color:#5c5c5c}
  .ann h3{font-size:18px;font-weight:600;margin-bottom:12px}
  .ann p{margin-bottom:10px;font-size:14px}

  @media print{
    body > *:not(.layer){display:none!important}
    .layer{position:static;transform:none;box-shadow:none;visibility:visible}
    .layer-bar,.print-btn{display:none}
  }

  /* ---------- Responsive ---------- */
  @media (max-width:900px){
    .layout{flex-direction:column;align-items:stretch;padding:20px 16px 80px}
    .aside{width:auto}
    .banner{height:150px}
    .banner h1{left:16px;font-size:22px}
  }
  @media (max-width:600px){
    .courses-dd span{display:none}
    .help{display:none}
    .vsep{margin:0 12px}
    .row{padding:12px 16px}
    .child{padding-left:30px;padding-right:16px}
    .ann-table{margin:0 8px}
    .ann-th .col-date,.ann-row .col-date{width:96px;font-size:12px}
    .ann-toolbar{padding:0 16px}
    .section-head .search{margin-right:16px}
    .layer-head{padding:16px 18px}
    .layer-head h1{font-size:24px}
    .layer-content{padding:20px 18px 48px}
    .gd ul{padding-left:16px}
    .layer-content.gd{padding-top:28px}
    .layer-head{min-height:0}
    .ann{padding:18px}
    .peek{left:24px}
    .peek-close{left:-18px}
    .peek-head h1{font-size:24px}
    .peek-body{padding:10px 18px 48px}
  }
</style>
</head>
<body>

<header class="topbar">
  <span class="home" aria-label="Inicio">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M4 10.2 12 4l8 6.2V20h-5.5v-5.5h-5V20H4z"/></svg>
  </span>
  <span class="courses-dd"><span>Cursos</span>
    <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 2.5h10L5 8z" fill="#fff"/></svg>
  </span>
  <span class="vsep"></span>
  <span class="course-name" id="topCourseName"></span>
  <span class="spacer"></span>
  <span class="pill">ABIERTO</span>
</header>

<nav class="tabs" id="tabs">
  <span class="tab clickable active" data-tab="portada" role="button" tabindex="0">Portada</span>
  <span class="tab">Calendario</span>
  <span class="tab clickable" data-tab="anuncios" role="button" tabindex="0">Anuncios<span class="badge" id="badgeAnuncios"></span></span>
  <span class="tab">Debates</span>
  <span class="tab">Libro de calificaciones<span class="badge" id="badgeCalif"></span></span>
  <span class="tab">Mensajes</span>
  <span class="tab">Grupos</span>
  <span class="tab">Logros</span>
</nav>

<section class="banner" id="banner">
  <svg viewBox="0 0 1919 200" preserveAspectRatio="xMinYMin slice" aria-hidden="true">
    <defs>
      <linearGradient id="gR" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5a1b1b"/><stop offset=".35" stop-color="#6b2020"/><stop offset="1" stop-color="#6e2121"/>
      </linearGradient>
      <linearGradient id="gM" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5c1c1c"/><stop offset="1" stop-color="#651f1f"/>
      </linearGradient>
    </defs>
    <rect width="1919" height="200" fill="url(#gM)"/>
    <ellipse cx="355" cy="-214" rx="500" ry="304" fill="#6e2121"/>
    <polygon points="1335,0 1919,0 1919,200 1120,200" fill="url(#gR)"/>
  </svg>
  <h1 id="bannerTitle"></h1>
</section>

<div class="layout" id="portada">
  <main class="main">
    <div class="section-head">
      <h2>Documentación del curso</h2>
      <span class="search" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2.6" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="m15.5 15.5 6 6"/></svg>
      </span>
    </div>
    <ul class="content-list" id="contentList"></ul>
  </main>

  <aside class="aside">
    <div class="side-card">
      <h2>Profesorado</h2>
      <div class="teacher">
        <img class="avatar" id="teacherPhoto" alt="">
        <div class="info">
          <div class="name" id="teacherName"></div>
          <span class="role">PROFESOR</span>
        </div>
        <span class="mail" aria-hidden="true">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="1" y="1" width="16" height="12" rx=".5"/><path d="m1 1 8 6.5L17 1M1 13l6-5.2M17 13l-6-5.2"/></svg>
        </span>
      </div>
    </div>
  </aside>
</div>

<section class="ann-page" id="annPage" style="display:none">
  <div class="ann-toolbar">
    <span>1 Total</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="m15.5 15.5 6 6"/></svg>
  </div>
  <div class="ann-table">
    <div class="ann-th">
      <span class="first">Anuncio <svg width="8" height="12" viewBox="0 0 8 12"><path d="M4 1 7.5 5h-7zM4 11 .5 7h7z" fill="#262626"/></svg></span>
      <span class="col-date">Publicación <svg width="8" height="12" viewBox="0 0 8 12"><path d="M4 1 7.5 5h-7zM4 11 .5 7h7z" fill="#262626"/></svg></span>
    </div>
    <div class="ann-row" id="annRow" role="button" tabindex="0">
      <span class="state" id="annState"></span>
      <svg class="mega" width="38" height="38" viewBox="0 0 38 38" fill="none" stroke="#262626" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M4.5 27.5 22 9.5l8 16.5z"/><path d="M22 9.5c2.5-1 6 2.4 8.8 7.6 2.6 5 3 8.6.7 9.7"/><path d="M4.5 27.5c-1.2 1.5 1.2 4.6 3 4.2"/><path d="m9 30.2 2.4 5 4.2-1.8-1.8-4"/><path d="M27 7.5 29.5 2.5M30.5 11.5l5-3M32 16.5h4.5"/></svg>
      <div class="ann-text"><div class="ann-title" id="annRowTitle"></div><div class="ann-prev" id="annRowPrev"></div></div>
      <span class="col-date" id="annRowDate"></span>
    </div>
  </div>
</section>

<span class="help" aria-hidden="true">
  <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5a10.5 10.5 0 1 1-5.2 19.6L3 23.5l1.5-4.7A10.5 10.5 0 0 1 13 2.5z"/><path d="M10.2 10.2a2.9 2.9 0 1 1 4 2.6c-.8.4-1.2 1-1.2 1.8v.6"/><circle cx="13" cy="18.4" r=".4" fill="currentColor"/></svg>
</span>

<div class="overlay" id="overlay"></div>
<div class="peek" id="peek" role="dialog" aria-modal="true" aria-labelledby="peekTitle">
  <button class="peek-close" id="peekClose" aria-label="Cerrar">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="square"><path d="M3 3l12 12M15 3 3 15"/></svg>
  </button>
  <div class="peek-head">
    <div class="peek-kicker">Anuncios del curso</div>
    <h1 id="peekTitle"></h1>
  </div>
  <div class="peek-body" id="peekBody"></div>
</div>
<div class="layer" id="layer" role="dialog" aria-modal="true" aria-labelledby="layerTitle">
  <div class="layer-bar">
    <button class="layer-close" id="layerClose" aria-label="Cerrar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>
    </button>
    <nav class="crumbs" aria-label="Ruta">
      <span id="crumbCourse"></span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
      <strong id="crumbPage"></strong>
    </nav>
  </div>
  <div class="layer-scroll" id="layerScroll">
    <div class="layer-head">
      <h1 id="layerTitle"></h1>
      <button class="print-btn" id="printBtn" aria-label="Imprimir">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8" rx="1.5"/><path d="M7 14h10v6.5H7z"/></svg>
      </button>
    </div>
    <div class="layer-content" id="layerContent"></div>
  </div>
</div>

<script>
(() => {
  const PROFESOR = `${PROFESOR_NOMBRE} ${PROFESOR_APELLIDO}`.trim();
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const ICON = {
    doc: `<svg width="22" height="24" viewBox="0 0 22 24" fill="none" stroke="#262626" stroke-width="1.6" stroke-linejoin="round"><path d="M3 1.5h10.5L19 7v15.5H3z"/><path d="M13.5 1.5V7H19"/><path d="M6.5 11.5h9M6.5 14.5h9M6.5 17.5h9" stroke-width="1.4"/></svg>`,
    folder: `<svg class="ic-closed" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#262626" stroke-width="1.6" stroke-linejoin="round"><path d="M1.5 3.5h6.5l2 2.5h10.5v13.5h-19z"/><path d="M1.5 7.5h19"/></svg>`,
    folderOpen: `<svg class="ic-open" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#262626" stroke-width="1.6" stroke-linejoin="round"><path d="M1.5 3.5h6.5l2 2.5h10.5v13.5h-19z"/><path d="M1.5 9.5h19"/><path d="M3.5 7.5V6h15v1.5"/></svg>`,
    task: `<svg width="22" height="24" viewBox="0 0 22 24" fill="none" stroke="#262626" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M3 1.5h10.5L19 7v15.5H3z"/><path d="M13.5 1.5V7H19"/><path d="m7 15 2.5 2.5L15 12"/></svg>`,
    assign: `<svg width="20" height="24" viewBox="0 0 20 24" fill="none" stroke="#262626" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M1.5 1.5h11l6 6v15h-17z"/><path d="M12.5 1.5v6h6"/><path d="m4.5 11 1.4 1.4 2.4-2.6M10.5 11.2h4.5M4.6 15.6l3 3M7.6 15.6l-3 3M10.5 17.2h4.5" stroke-width="1.3"/></svg>`,
    chev: `<svg class="chev" width="18" height="10" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 8 8 8-8"/></svg>`
  };

  // Cabecera
  $("topCourseName").textContent = ASIGNATURA;
  $("bannerTitle").textContent = ASIGNATURA;
  $("crumbCourse").textContent = ASIGNATURA;
  document.title = `${ASIGNATURA} – Aula Virtual ADI`;
  [["badgeAnuncios", AVISOS_ANUNCIOS], ["badgeCalif", AVISOS_CALIFICACIONES]].forEach(([id, n]) => {
    if (n > 0) $(id).textContent = n; else $(id).remove();
  });

  // Avatar (si la foto no carga, sale la inicial)
  function avatar(img) {
    img.src = PROFESOR_FOTO;
    img.alt = PROFESOR;
    img.onerror = () => {
      const d = document.createElement("div");
      d.className = img.className;
      d.textContent = PROFESOR_NOMBRE.charAt(0);
      img.replaceWith(d);
    };
  }
  avatar($("teacherPhoto"));
  $("teacherName").textContent = PROFESOR;
  $("teacherName").title = PROFESOR;

  // Lista de documentación
  const desc = d => d ? `<div class="desc">${esc(d)}</div>` : "";
  let html = `
    <li class="item">
      <div class="row clickable" id="guiaBtn" role="button" tabindex="0">
        <div class="row-main"><div class="row-line">${ICON.doc}<span class="title">Guía docente</span></div></div>
      </div>
    </li>`;

  APARTADOS_NO_PULSABLES.forEach(a => {
    html += `
    <li class="item">
      <div class="row${a.descripcion ? " has-desc" : ""}">
        <div class="row-main"><div class="row-line">${ICON.folder}<span class="title">${esc(a.titulo)}</span></div>${desc(a.descripcion)}</div>
        ${ICON.chev}
      </div>
    </li>`;
  });

  const tareas = TAREAS.map((t, i) => `
      <div class="child">
        <div class="row-line">${ICON.assign}<span class="title" data-task="${i}" role="button" tabindex="0">${esc(t.titulo)}</span></div>
        <div class="meta">Fecha de entrega: ${esc(t.fecha)}</div>
      </div>`).join("");
  html += `
    <li class="item">
      <div class="row clickable${CARPETA_TAREAS.descripcion ? " has-desc" : ""}" data-toggle role="button" tabindex="0" aria-expanded="false">
        <div class="row-main"><div class="row-line">${ICON.folder}${ICON.folderOpen}<span class="title">${esc(CARPETA_TAREAS.titulo)}</span></div>${desc(CARPETA_TAREAS.descripcion)}</div>
        ${ICON.chev}
      </div>
      <div class="folder-body"><div class="folder-inner"><div>${tareas}</div></div></div>
    </li>`;
  const list = $("contentList");
  list.innerHTML = html;

  // Desplegar carpetas
  list.addEventListener("click", e => {
    const task = e.target.closest("[data-task]");
    if (task) return openTask(TAREAS[task.dataset.task]);
    const row = e.target.closest("[data-toggle]");
    if (!row) return;
    const open = row.parentNode.classList.toggle("open");
    row.setAttribute("aria-expanded", open);
  });
  list.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".row.clickable, [data-task]")) {
      e.preventDefault(); e.target.click();
    }
  });

  // Vistas: Portada / Anuncios
  const tabs = document.querySelectorAll(".tab");
  let currentView = "portada";
  function setTab(name) { tabs.forEach(t => t.classList.toggle("active", t.dataset.tab === name)); }
  function showView(v) {
    currentView = v;
    const portada = v === "portada";
    $("banner").style.display = portada ? "" : "none";
    $("portada").style.display = portada ? "" : "none";
    $("annPage").style.display = portada ? "none" : "";
    setTab(v);
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tab[data-tab]").forEach(t => {
    t.addEventListener("click", () => showView(t.dataset.tab));
    t.addEventListener("keydown", e => { if (e.key === "Enter") showView(t.dataset.tab); });
  });

  // Capa a pantalla completa (Guía docente / tareas / anuncio)
  const layer = $("layer"), overlay = $("overlay");
  function openLayer(title, content, cls) {
    $("crumbPage").textContent = title;
    $("layerTitle").textContent = title;
    const c = $("layerContent");
    c.className = "layer-content " + cls;
    c.innerHTML = content;
    c.querySelectorAll("img.avatar").forEach(avatar);
    $("layerScroll").scrollTop = 0;
    layer.classList.add("show"); overlay.classList.add("show");
    document.body.style.overflow = "hidden";
    $("layerClose").focus();
  }
  function closeLayer() {
    layer.classList.remove("show"); overlay.classList.remove("show");
    document.body.style.overflow = "";
  }
  $("layerClose").onclick = closeLayer;
  overlay.onclick = closeLayer;
  $("printBtn").onclick = () => window.print();
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLayer(); });

  $("guiaBtn").onclick = () => openLayer("Guía docente", GUIA_DOCENTE, "gd");

  function openTask(t) {
    const img = t.imagen ? `<img src="${esc(t.imagen)}" alt="${esc(t.titulo)}" onerror="this.remove()">` : "";
    openLayer(t.titulo, `
      <div class="task-doc">
        <p class="due"><strong>Fecha de entrega:</strong> ${esc(t.fecha)}</p>
        <h3>Instrucciones</h3>
        ${t.instrucciones}
        ${img}
      </div>`, "");
  }

  // Anuncios
  const STATE_UNREAD = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#262626" stroke-width="1.6"><circle cx="8" cy="8" r="6.5"/></svg>`;
  const STATE_READ = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#262626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="m5.2 8.2 2 2 3.6-4"/></svg>`;
  const tmp = document.createElement("div");
  tmp.innerHTML = ANUNCIO.texto;
  $("annRowTitle").textContent = ANUNCIO.titulo;
  $("annRowPrev").textContent = tmp.textContent.replace(/\s+/g, " ").trim();
  $("annRowDate").textContent = ANUNCIO.fecha;
  $("annState").innerHTML = AVISOS_ANUNCIOS > 0 ? STATE_UNREAD : STATE_READ;
  if (AVISOS_ANUNCIOS <= 0) $("annRow").classList.add("read");

  const peek = $("peek");
  function openAnuncio() {
    $("peekTitle").textContent = ANUNCIO.titulo;
    $("peekBody").innerHTML = ANUNCIO.texto;
    $("peekBody").scrollTop = 0;
    peek.classList.add("show"); overlay.classList.add("show");
    document.body.style.overflow = "hidden";
    $("peekClose").focus();
    $("annRow").classList.add("read");
    $("annState").innerHTML = STATE_READ;
    const badge = $("badgeAnuncios");
    if (badge) badge.remove();
  }
  function closePeek() {
    peek.classList.remove("show"); overlay.classList.remove("show");
    document.body.style.overflow = "";
  }
  $("peekClose").onclick = closePeek;
  overlay.addEventListener("click", closePeek);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePeek(); });
  $("annRow").addEventListener("click", openAnuncio);
  $("annRow").addEventListener("keydown", e => { if (e.key === "Enter") openAnuncio(); });
})();
</script>
</body>
</html>
